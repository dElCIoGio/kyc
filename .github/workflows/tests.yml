name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install engine
        run: python -m pip install -e .

      - name: Run engine tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py" -v

  api-tests:
    name: API tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kyc_test
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: kyc-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyc -d kyc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      KYC_TEST_DATABASE_URL: postgresql+psycopg://kyc:kyc-ci-only@127.0.0.1:5432/kyc_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/src/kyc_api/verify/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: web/go.mod
          cache: false

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install engine and API test dependencies
        run: |
          python -m pip install -e .
          # nif-checker is a repository-local package.  Install it before the
          # API so the API's normal distribution dependency is satisfied
          # without requiring a published checker on an external index.
          python -m pip install -e ./nif-checker
          python -m pip install -e "api[dev]"
          python -c "from nif_checker import AGTNIFVerifier; assert AGTNIFVerifier"

      - name: Build hosted verifier
        working-directory: api/src/kyc_api/verify
        run: |
          npm ci
          npm run check
          npm run build

      - name: Run PostgreSQL migrations twice
        env:
          KYC_DATABASE_URL: ${{ env.KYC_TEST_DATABASE_URL }}
        run: |
          kyc-api-migrate upgrade head
          kyc-api-migrate upgrade head

      - name: Validate Compose configuration and build images
        run: |
          docker compose config
          docker compose build api migrate

      - name: Run API tests
        env:
          PYTHONPATH: src:api/src
        run: python -m unittest discover -s api/tests -p "test_*.py" -v

      - name: Run integration sandbox tests
        working-directory: web
        run: go test ./...

      - name: Build and inspect checker and API wheels
        run: |
          python -m build --wheel --outdir nif-checker/dist nif-checker
          python -m build --wheel --outdir api/dist api
          python api/scripts/check_verifier_wheel.py api/dist/*.whl
          python -c "import glob, zipfile; names=zipfile.ZipFile(glob.glob('api/dist/*.whl')[0]).namelist(); assert any(name.endswith('alembic.ini') for name in names); assert any('/migrations/versions/' in name for name in names)"
