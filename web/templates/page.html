{{define "page"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KYC Desk</title>
    <link rel="stylesheet" href="/assets/app.css">
    <script src="/assets/htmx.min.js" defer></script>
    <script src="/assets/app.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8 lg:py-12">
      <header class="mb-8 flex flex-col gap-4 border-b border-slate-200 pb-7 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="mb-2 text-sm font-semibold uppercase tracking-[0.18em] text-teal-700">Secure operator workspace</p>
          <h1 class="text-3xl font-semibold tracking-tight text-slate-950 sm:text-4xl">KYC Desk</h1>
          <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600">Review identity-card extraction with a guided, short-lived workflow.</p>
        </div>
        <p class="rounded-full bg-teal-50 px-4 py-2 text-sm font-medium text-teal-800">Images are removed after processing</p>
      </header>
      {{template "dashboard" .}}
    </main>
  </body>
</html>
{{end}}
