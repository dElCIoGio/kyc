name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install engine
        run: python -m pip install -e .

      - name: Run engine tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py" -v

  api-tests:
    name: API tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/src/kyc_api/verify/package-lock.json

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install engine and API test dependencies
        run: |
          python -m pip install -e .
          # nif-checker is a repository-local package.  Install it before the
          # API so the API's normal distribution dependency is satisfied
          # without requiring a published checker on an external index.
          python -m pip install -e ./nif-checker
          python -m pip install -e "api[dev]"
          python -c "from nif_checker import AGTNIFVerifier; assert AGTNIFVerifier"

      - name: Build hosted verifier
        working-directory: api/src/kyc_api/verify
        run: |
          npm ci
          npm run check
          npm run build

      - name: Run API tests
        env:
          PYTHONPATH: src:api/src
        run: python -m unittest discover -s api/tests -p "test_*.py" -v

      - name: Build and inspect checker and API wheels
        run: |
          python -m build --wheel --outdir nif-checker/dist nif-checker
          python -m build --wheel --outdir api/dist api
          python api/scripts/check_verifier_wheel.py api/dist/*.whl
