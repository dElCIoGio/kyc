name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install engine
        run: python -m pip install -e .

      - name: Run engine tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py" -v

  api-tests:
    name: API tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install engine and API test dependencies
        run: |
          python -m pip install -e .
          python -m pip install -e "api[dev]"

      - name: Run API tests
        env:
          PYTHONPATH: src:api/src
        run: python -m unittest discover -s api/tests -p "test_*.py" -v
