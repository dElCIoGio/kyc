services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kyc
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: ${KYC_DATABASE_PASSWORD:-kyc-development-only}
    volumes:
      - kyc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d kyc"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      KYC_DATABASE_URL: postgresql+psycopg://kyc:${KYC_DATABASE_PASSWORD:-kyc-development-only}@postgres:5432/kyc
    command: ["kyc-api-migrate", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    environment:
      KYC_SESSION_BACKEND: postgres
      KYC_DATABASE_URL: postgresql+psycopg://kyc:${KYC_DATABASE_PASSWORD:-kyc-development-only}@postgres:5432/kyc
      # The host model directory is mounted at /models in the container.
      KYC_OCR_MODEL_MANIFEST: /models/paddleocr/ao-id-front-v5-mobile/manifest.json
    expose:
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./private-models:/models:ro
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      KYC_API_KEY: ${KYC_API_KEY}
      KYC_WEB_ADDRESS: :8080
      KYC_WEB_API_URL: http://api:8000
      KYC_WEB_COOKIE_SECURE: ${KYC_WEB_COOKIE_SECURE:-false}
      KYC_WEBHOOK_SECRET: ${KYC_WEBHOOK_SECRET}
    ports:
      - "${KYC_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kyc-postgres-data:
